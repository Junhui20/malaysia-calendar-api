openapi: 3.1.0
info:
  title: Malaysia Calendar API
  version: 0.1.4
  description: >
    A comprehensive API for Malaysian public holidays, school terms, business day
    calculations, and state-level calendar data. Data is sourced from official
    government gazettes (JPM, JAKIM, state governments) and covers federal and
    state holidays, Islamic observances, replacement holidays, school calendars,
    and exam schedules.
  contact:
    name: Malaysia Calendar API
    url: https://api.mycal.my
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://mycal-api.huijun00100101.workers.dev/v1
    description: Production

tags:
  - name: Holidays
    description: Public and state holidays, date checks, and lookups
  - name: States
    description: Malaysian state metadata and resolution
  - name: Business Days
    description: Working day calculations
  - name: School
    description: School terms, holidays, and exam schedules
  - name: Feeds
    description: Calendar feeds (iCal, CSV, RSS)
  - name: Meta
    description: API metadata and data change log
  - name: Open Data
    description: Raw, cacheable, no-API-key JSON snapshots of the calendar dataset
  - name: Prayer Times
    description: JAKIM Waktu Solat prayer times by zone
  - name: API Keys
    description: Self-serve API key issuance and lookup (issuance is admin-gated for now)
  - name: Webhooks
    description: Webhook subscriptions for data-change events (admin-gated for now)

paths:
  /holidays:
    get:
      operationId: listHolidays
      summary: List holidays
      description: >
        Returns holidays for a given year, optionally filtered by state, month,
        type, or status.
      tags:
        - Holidays
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - $ref: "#/components/parameters/StateParam"
        - name: month
          in: query
          description: Filter by month (1-12).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 2
        - name: type
          in: query
          description: Filter by holiday type.
          required: false
          schema:
            $ref: "#/components/schemas/HolidayType"
        - name: status
          in: query
          description: Filter by holiday status.
          required: false
          schema:
            $ref: "#/components/schemas/HolidayStatus"
      responses:
        "200":
          description: List of holidays matching the filters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holiday"
                  meta:
                    type: object
                    required:
                      - total
                      - year
                      - lastUpdated
                    properties:
                      total:
                        type: integer
                        example: 23
                      year:
                        type: integer
                        example: 2026
                      state:
                        type: string
                        nullable: true
                        example: "SGR"
                      lastUpdated:
                        type: string
                        format: date-time
                        example: "2026-01-15T08:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /holidays/today:
    get:
      operationId: getHolidaysToday
      summary: Check today's holidays
      description: Returns whether today is a holiday and lists any holidays that fall on today.
      tags:
        - Holidays
      parameters:
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Today's holiday information.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - date
                      - holidays
                      - isHoliday
                    properties:
                      date:
                        type: string
                        format: date
                        example: "2026-02-01"
                      holidays:
                        type: array
                        items:
                          $ref: "#/components/schemas/Holiday"
                      isHoliday:
                        type: boolean
                        example: true
                  meta:
                    type: object
                    properties:
                      state:
                        type: string
                        nullable: true
                        example: "KUL"

  /holidays/next:
    get:
      operationId: getNextHolidays
      summary: Get upcoming holidays
      description: Returns the next upcoming holidays from today.
      tags:
        - Holidays
      parameters:
        - $ref: "#/components/parameters/StateParam"
        - name: type
          in: query
          description: Filter by holiday type.
          required: false
          schema:
            $ref: "#/components/schemas/HolidayType"
        - name: limit
          in: query
          description: Number of upcoming holidays to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
            example: 3
      responses:
        "200":
          description: Upcoming holidays.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holiday"
                  meta:
                    type: object
                    required:
                      - afterDate
                    properties:
                      afterDate:
                        type: string
                        format: date
                        example: "2026-03-15"
                      state:
                        type: string
                        nullable: true
                        example: "JHR"

  /holidays/between:
    get:
      operationId: getHolidaysBetween
      summary: Get holidays in a date range
      description: Returns all holidays between two dates, optionally filtered by state.
      tags:
        - Holidays
      parameters:
        - name: start
          in: query
          description: Start date (inclusive).
          required: true
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: end
          in: query
          description: End date (inclusive).
          required: true
          schema:
            type: string
            format: date
            example: "2026-06-30"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Holidays within the date range.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holiday"
                  meta:
                    type: object
                    required:
                      - total
                      - start
                      - end
                    properties:
                      total:
                        type: integer
                        example: 12
                      start:
                        type: string
                        format: date
                        example: "2026-01-01"
                      end:
                        type: string
                        format: date
                        example: "2026-06-30"
                      state:
                        type: string
                        nullable: true
                        example: "PNG"
        "400":
          $ref: "#/components/responses/BadRequest"

  /holidays/check:
    get:
      operationId: checkDate
      summary: Check a specific date
      description: >
        Returns detailed information about a specific date including whether it
        is a holiday, weekend, working day, or school day for the given state.
      tags:
        - Holidays
      parameters:
        - name: date
          in: query
          description: Date to check.
          required: true
          schema:
            type: string
            format: date
            example: "2026-02-01"
        - name: state
          in: query
          description: State code (required for weekend and school day resolution).
          required: true
          schema:
            type: string
            example: "SGR"
      responses:
        "200":
          description: Detailed date check result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/CheckDateResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /holidays/long-weekends:
    get:
      operationId: getLongWeekends
      summary: Get long weekends
      description: >
        Returns all stretches of three or more consecutive non-working days
        (weekends plus public holidays) for the given year and state, including
        the number of bridge days needed to extend each break.
      tags:
        - Holidays
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: Long weekends for the year.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - startDate
                        - endDate
                        - totalDays
                        - holidays
                        - weekendDays
                        - bridgeDaysNeeded
                      properties:
                        startDate:
                          type: string
                          format: date
                          example: "2026-05-01"
                        endDate:
                          type: string
                          format: date
                          example: "2026-05-03"
                        totalDays:
                          type: integer
                          example: 3
                        holidays:
                          type: array
                          items:
                            $ref: "#/components/schemas/Holiday"
                        weekendDays:
                          type: integer
                          example: 2
                        bridgeDaysNeeded:
                          type: integer
                          example: 0
                  meta:
                    type: object
                    required:
                      - year
                      - state
                      - total
                    properties:
                      year:
                        type: integer
                        example: 2026
                      state:
                        type: string
                        example: "selangor"
                      total:
                        type: integer
                        example: 7
        "400":
          $ref: "#/components/responses/BadRequest"

  /holidays/leave-optimizer:
    get:
      operationId: getLeaveOptimizer
      summary: Suggest optimal annual-leave days
      description: >
        Suggests annual-leave days to spend (up to `maxLeave`) to maximise the
        length of the resulting consecutive break, by bridging weekends and
        public holidays. Suggestions are sorted by efficiency (days off per
        leave day spent).
      tags:
        - Holidays
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - $ref: "#/components/parameters/StateParam"
        - name: maxLeave
          in: query
          description: Maximum annual-leave days to spend per suggested break.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
            example: 2
        - name: limit
          in: query
          description: Maximum number of suggestions to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
      responses:
        "200":
          description: Leave-optimizer suggestions, most efficient first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - leaveDates
                        - leaveCost
                        - startDate
                        - endDate
                        - totalDays
                        - efficiency
                        - holidays
                      properties:
                        leaveDates:
                          type: array
                          items:
                            type: string
                            format: date
                          description: Dates the caller should take as annual leave.
                          example:
                            - "2026-05-04"
                        leaveCost:
                          type: integer
                          description: Number of annual-leave days spent.
                          example: 1
                        startDate:
                          type: string
                          format: date
                          example: "2026-05-01"
                        endDate:
                          type: string
                          format: date
                          example: "2026-05-05"
                        totalDays:
                          type: integer
                          description: Total consecutive days off (weekends + holidays + leave).
                          example: 5
                        efficiency:
                          type: number
                          description: totalDays / leaveCost.
                          example: 5
                        holidays:
                          type: array
                          items:
                            $ref: "#/components/schemas/Holiday"
                  meta:
                    type: object
                    required:
                      - year
                      - state
                      - maxLeave
                      - total
                    properties:
                      year:
                        type: integer
                        example: 2026
                      state:
                        type: string
                        example: "selangor"
                      maxLeave:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 8
        "400":
          $ref: "#/components/responses/BadRequest"

  /states:
    get:
      operationId: listStates
      summary: List all states
      description: Returns all Malaysian states and federal territories with their metadata.
      tags:
        - States
      responses:
        "200":
          description: All states.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/State"
                  meta:
                    type: object
                    required:
                      - total
                    properties:
                      total:
                        type: integer
                        example: 16

  /states/resolve:
    get:
      operationId: resolveState
      summary: Resolve a state query
      description: >
        Resolves a free-text query (alias, abbreviation, or name) to a canonical
        state code. Returns 404 with suggestions if no exact match is found.
      tags:
        - States
      parameters:
        - name: q
          in: query
          description: State name, alias, or abbreviation to resolve.
          required: true
          schema:
            type: string
            example: "KL"
      responses:
        "200":
          description: Resolved state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - canonical
                      - name
                      - type
                      - group
                    properties:
                      canonical:
                        type: string
                        example: "KUL"
                      name:
                        type: string
                        example: "Kuala Lumpur"
                      type:
                        type: string
                        enum:
                          - state
                          - federal_territory
                        example: "federal_territory"
                      group:
                        type: string
                        enum:
                          - A
                          - B
                        example: "A"
        "404":
          description: State not found. Suggestions may be provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /business-days:
    get:
      operationId: getBusinessDays
      summary: Count business days in a range
      description: >
        Calculates the number of business (working) days between two dates for a
        given state, accounting for weekends and public holidays.
      tags:
        - Business Days
      parameters:
        - name: start
          in: query
          required: true
          description: Start date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-03-01"
        - name: end
          in: query
          required: true
          description: End date (inclusive).
          schema:
            type: string
            format: date
            example: "2026-03-31"
        - name: state
          in: query
          required: true
          description: State code for weekend and holiday resolution.
          schema:
            type: string
            example: "SGR"
      responses:
        "200":
          description: Business day calculation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/BusinessDaysResult"
                  meta:
                    type: object
                    required:
                      - start
                      - end
                      - state
                    properties:
                      start:
                        type: string
                        format: date
                        example: "2026-03-01"
                      end:
                        type: string
                        format: date
                        example: "2026-03-31"
                      state:
                        type: string
                        example: "SGR"
        "400":
          $ref: "#/components/responses/BadRequest"

  /business-days/add:
    get:
      operationId: addBusinessDays
      summary: Add business days to a date
      description: >
        Calculates the resulting date after adding a number of business days to a
        start date, skipping weekends and public holidays.
      tags:
        - Business Days
      parameters:
        - name: date
          in: query
          required: true
          description: Start date.
          schema:
            type: string
            format: date
            example: "2026-03-15"
        - name: days
          in: query
          required: true
          description: Number of business days to add.
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: state
          in: query
          required: true
          description: State code for weekend and holiday resolution.
          schema:
            type: string
            example: "SGR"
      responses:
        "200":
          description: Calculated result date.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - startDate
                      - businessDays
                      - resultDate
                    properties:
                      startDate:
                        type: string
                        format: date
                        example: "2026-03-15"
                      businessDays:
                        type: integer
                        example: 5
                      resultDate:
                        type: string
                        format: date
                        example: "2026-03-22"
        "400":
          $ref: "#/components/responses/BadRequest"

  /school/terms:
    get:
      operationId: getSchoolTerms
      summary: Get school terms
      description: >
        Returns school term dates and durations for a given year. Optionally
        filter by group or resolve group from state code.
      tags:
        - School
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - $ref: "#/components/parameters/GroupParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: School terms.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchoolTerm"
                  meta:
                    type: object
                    required:
                      - year
                      - total
                    properties:
                      year:
                        type: integer
                        example: 2026
                      group:
                        type: string
                        enum:
                          - A
                          - B
                        nullable: true
                        example: "A"
                      total:
                        type: integer
                        example: 2

  /school/holidays:
    get:
      operationId: getSchoolHolidays
      summary: Get school holidays
      description: Returns school holiday periods for a given year.
      tags:
        - School
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - $ref: "#/components/parameters/GroupParam"
        - $ref: "#/components/parameters/StateParam"
      responses:
        "200":
          description: School holidays.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchoolHoliday"
                  meta:
                    type: object
                    required:
                      - year
                      - total
                    properties:
                      year:
                        type: integer
                        example: 2026
                      group:
                        type: string
                        enum:
                          - A
                          - B
                        nullable: true
                        example: "B"
                      total:
                        type: integer
                        example: 5

  /school/exams:
    get:
      operationId: getSchoolExams
      summary: Get exam schedules
      description: Returns national exam schedules for a given year.
      tags:
        - School
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - name: type
          in: query
          description: Filter by exam type.
          required: false
          schema:
            $ref: "#/components/schemas/ExamType"
      responses:
        "200":
          description: Exam schedules.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exam"
                  meta:
                    type: object
                    required:
                      - year
                      - total
                    properties:
                      year:
                        type: integer
                        example: 2026
                      total:
                        type: integer
                        example: 5

  /school/is-school-day:
    get:
      operationId: isSchoolDay
      summary: Check if a date is a school day
      description: >
        Returns whether a specific date is a school day, including details about
        the current term, any school holiday, and public holiday status.
      tags:
        - School
      parameters:
        - name: date
          in: query
          required: true
          description: Date to check.
          schema:
            type: string
            format: date
            example: "2026-03-16"
        - $ref: "#/components/parameters/StateParam"
        - $ref: "#/components/parameters/GroupParam"
      responses:
        "200":
          description: School day check result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - date
                      - dayOfWeek
                      - isSchoolDay
                      - isPublicHoliday
                      - isWeekend
                      - group
                    properties:
                      date:
                        type: string
                        format: date
                        example: "2026-03-16"
                      dayOfWeek:
                        type: string
                        example: "Monday"
                      isSchoolDay:
                        type: boolean
                        example: true
                      isPublicHoliday:
                        type: boolean
                        example: false
                      isWeekend:
                        type: boolean
                        example: false
                      group:
                        type: string
                        enum:
                          - A
                          - B
                        example: "A"
                      term:
                        type: object
                        nullable: true
                        properties:
                          term:
                            type: integer
                            enum:
                              - 1
                              - 2
                            example: 1
                          startDate:
                            type: string
                            format: date
                          endDate:
                            type: string
                            format: date
                      holiday:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                            example: "Cuti Pertengahan Penggal 1"
                          startDate:
                            type: string
                            format: date
                          endDate:
                            type: string
                            format: date
        "400":
          $ref: "#/components/responses/BadRequest"

  /feed/ical/{state}:
    get:
      operationId: getIcalFeed
      summary: iCal calendar feed
      description: Returns an iCalendar (.ics) feed of holidays for the specified state.
      tags:
        - Feeds
      parameters:
        - name: state
          in: path
          required: true
          description: State code.
          schema:
            type: string
            example: "SGR"
        - $ref: "#/components/parameters/YearParam"
      responses:
        "200":
          description: iCalendar feed.
          content:
            text/calendar:
              schema:
                type: string
                example: |
                  BEGIN:VCALENDAR
                  VERSION:2.0
                  PRODID:-//MyCal//Malaysia Calendar API//EN
                  BEGIN:VEVENT
                  DTSTART:20260201
                  SUMMARY:Hari Wilayah Persekutuan
                  END:VEVENT
                  END:VCALENDAR

  /feed/csv/{state}:
    get:
      operationId: getCsvFeed
      summary: CSV calendar export
      description: >
        Returns a CSV (spreadsheet/HR-friendly) export of public holidays for
        the specified state and year.
      tags:
        - Feeds
      parameters:
        - name: state
          in: path
          required: true
          description: State code.
          schema:
            type: string
            example: "SGR"
        - $ref: "#/components/parameters/YearParam"
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  date,end_date,name_en,name_ms,type,status,states
                  2026-08-31,,National Day,Hari Kebangsaan,federal,confirmed,*
        "400":
          $ref: "#/components/responses/BadRequest"

  /feed/rss:
    get:
      operationId: getRssFeed
      summary: RSS feed
      description: Returns an RSS feed of upcoming holidays.
      tags:
        - Feeds
      responses:
        "200":
          description: RSS feed.
          content:
            application/rss+xml:
              schema:
                type: string

  /changelog:
    get:
      operationId: getChangelog
      summary: Data change log
      description: >
        Returns a reverse-chronological log of data changes (publications,
        corrections, additions). Useful for tracking newly announced holidays
        such as cuti peristiwa.
      tags:
        - Meta
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 10
        - name: since
          in: query
          description: Only return entries on or after this ISO 8601 timestamp.
          required: false
          schema:
            type: string
            example: "2025-01-01"
      responses:
        "200":
          description: Change log entries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - timestamp
                        - event
                        - description
                      properties:
                        timestamp:
                          type: string
                          example: "2025-08-28T00:00:00+08:00"
                        event:
                          type: string
                          example: "data.published"
                        description:
                          type: string
                          example: "Initial 2026 holiday data published from JPM gazette"
                  meta:
                    type: object
                    required:
                      - total
                      - limit
                    properties:
                      total:
                        type: integer
                        example: 3
                      limit:
                        type: integer
                        example: 10

  /data/manifest:
    get:
      operationId: getOpenDataManifest
      summary: Open-data index
      description: >
        Returns the index of the open-data snapshot dataset — no API key
        required, and responses are cached hard at the edge/browser (they are
        immutable reference data).
      tags:
        - Open Data
      responses:
        "200":
          description: Open-data manifest.
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - description
                  - years
                  - states
                  - files
                  - license
                  - source
                properties:
                  name:
                    type: string
                    example: "mycal open data"
                  description:
                    type: string
                  years:
                    type: array
                    items:
                      type: integer
                    example:
                      - 2024
                      - 2025
                      - 2026
                      - 2027
                  states:
                    type: integer
                    description: Number of states/federal territories in the dataset.
                    example: 19
                  files:
                    type: object
                    properties:
                      states:
                        type: string
                        example: "/v1/data/states"
                      holidaysByYear:
                        type: string
                        example: "/v1/data/holidays/{year}"
                      everything:
                        type: string
                        example: "/v1/data/all"
                  license:
                    type: string
                    example: "MIT"
                  source:
                    type: string
                    example: "https://github.com/Junhui20/malaysia-calendar-api"

  /data/states:
    get:
      operationId: getOpenDataStates
      summary: Raw states dataset
      description: >
        Returns the raw states array with no response envelope — a direct
        snapshot of the underlying dataset, suitable for zero-SDK consumption.
      tags:
        - Open Data
      responses:
        "200":
          description: Raw array of all states and federal territories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/State"

  /data/holidays/{year}:
    get:
      operationId: getOpenDataHolidaysByYear
      summary: Raw holidays dataset for a year
      description: >
        Returns the raw holidays array for the given year with no response
        envelope, modelled on the gov.uk bank-holidays.json pattern.
      tags:
        - Open Data
      parameters:
        - name: year
          in: path
          required: true
          description: Calendar year.
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: Raw array of holidays for the year (empty array if none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          $ref: "#/components/responses/BadRequest"

  /data/all:
    get:
      operationId: getOpenDataAll
      summary: Full open-data snapshot
      description: >
        Returns the entire dataset in one snapshot — states plus holidays,
        school terms, school holidays, and exams keyed by year.
      tags:
        - Open Data
      responses:
        "200":
          description: Full dataset snapshot.
          content:
            application/json:
              schema:
                type: object
                required:
                  - states
                  - years
                  - meta
                properties:
                  states:
                    type: array
                    items:
                      $ref: "#/components/schemas/State"
                  years:
                    type: object
                    description: Keyed by year (e.g. "2026").
                    additionalProperties:
                      type: object
                      properties:
                        holidays:
                          type: array
                          items:
                            $ref: "#/components/schemas/Holiday"
                        schoolTerms:
                          type: array
                          items:
                            $ref: "#/components/schemas/SchoolTerm"
                        schoolHolidays:
                          type: array
                          items:
                            $ref: "#/components/schemas/SchoolHoliday"
                        exams:
                          type: array
                          items:
                            $ref: "#/components/schemas/Exam"
                  meta:
                    type: object
                    properties:
                      years:
                        type: array
                        items:
                          type: integer
                      license:
                        type: string
                        example: "MIT"

  /prayer-times/zones:
    get:
      operationId: getPrayerTimeZones
      summary: List JAKIM prayer-time zones
      description: >
        Returns the authoritative JAKIM zone directory (source:
        api.waktusolat.app/zones).
      tags:
        - Prayer Times
      responses:
        "200":
          description: All JAKIM zones.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - code
                        - state
                        - area
                      properties:
                        code:
                          type: string
                          example: "SGR01"
                        state:
                          type: string
                          example: "Selangor"
                        area:
                          type: string
                          example: "Gombak, Petaling, Sepang, Hulu Langat, Hulu Selangor, Shah Alam"
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 68
                      source:
                        type: string
                        example: "JAKIM (via api.waktusolat.app)"

  /prayer-times/{zone}:
    get:
      operationId: getPrayerTimes
      summary: Prayer times for a zone
      description: >
        Returns JAKIM Waktu Solat prayer times for a zone, proxied from
        api.waktusolat.app with an added MYT-formatted `times` object
        alongside the raw Unix-epoch fields (Malaysia is a fixed UTC+8 with no
        DST).
      tags:
        - Prayer Times
      parameters:
        - name: zone
          in: path
          required: true
          description: JAKIM zone code (see GET /prayer-times/zones).
          schema:
            type: string
            example: "SGR01"
        - name: year
          in: query
          required: false
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: false
          description: Month (1-12).
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
      responses:
        "200":
          description: Prayer times for the zone.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    properties:
                      zone:
                        type: string
                        example: "SGR01"
                      year:
                        type: integer
                        example: 2026
                      month:
                        type: string
                        example: "6"
                      prayers:
                        type: array
                        items:
                          type: object
                          description: Raw upstream fields (Unix epoch seconds) plus a `times` object with HH:MM (MYT).
                          properties:
                            times:
                              type: object
                              properties:
                                imsak:
                                  type: string
                                  example: "05:45"
                                fajr:
                                  type: string
                                  example: "05:55"
                                syuruk:
                                  type: string
                                  example: "07:12"
                                dhuha:
                                  type: string
                                  example: "07:35"
                                dhuhr:
                                  type: string
                                  example: "13:22"
                                asr:
                                  type: string
                                  example: "16:44"
                                maghrib:
                                  type: string
                                  example: "19:22"
                                isha:
                                  type: string
                                  example: "20:35"
                  meta:
                    type: object
                    properties:
                      zone:
                        type: string
                        example: "SGR01"
                      source:
                        type: string
                        example: "JAKIM (via api.waktusolat.app)"
                      timezone:
                        type: string
                        example: "Asia/Kuala_Lumpur"
        "400":
          description: Unknown JAKIM zone code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The upstream prayer-times source could not be reached or returned an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keys:
    post:
      operationId: issueApiKey
      summary: Issue an API key
      description: >
        Issues a new `mycal_…` API key backed by Cloudflare KV. **Admin-gated
        for now** (requires the `X-API-Key` admin header) — public self-serve
        issuance needs email verification/captcha first. Returns 503 if the
        `API_KEYS` KV namespace is not bound.
      tags:
        - API Keys
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum:
                    - free
                    - pro
                  default: free
                label:
                  type: string
                  maxLength: 80
                  example: "acme-corp-prod"
      responses:
        "201":
          description: Key issued. The raw key is only ever returned here.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                        example: "mycal_3f9a..."
                      tier:
                        type: string
                        enum:
                          - free
                          - pro
                      label:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    properties:
                      note:
                        type: string
                      limitPerMinute:
                        type: integer
                        example: 60
        "401":
          description: Missing or invalid admin `X-API-Key` header.
        "503":
          description: API key store not configured (no `API_KEYS` KV binding).
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Revokes a previously issued key. **Admin-gated** (requires the `X-API-Key` admin header).
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
              properties:
                key:
                  type: string
                  example: "mycal_3f9a..."
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing or invalid admin `X-API-Key` header.
        "503":
          description: API key store not configured (no `API_KEYS` KV binding).

  /keys/whoami:
    get:
      operationId: getApiKeyWhoami
      summary: Check the caller's tier
      description: >
        Returns the tier the presented key (via `Authorization: Bearer` or
        `X-API-Key`) resolves to, or `anonymous` if no valid key is presented.
        Public — no admin auth required.
      tags:
        - API Keys
      responses:
        "200":
          description: Caller's resolved tier.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      tier:
                        type: string
                        enum:
                          - anonymous
                          - free
                          - pro
                        example: "anonymous"
                      limitPerMinute:
                        type: integer
                        example: 30
                      keyed:
                        type: boolean
                        example: false

  /webhooks/subscribe:
    post:
      operationId: subscribeWebhook
      summary: Create a webhook subscription
      description: >
        Registers a webhook subscription for data-change events. **Admin-gated
        for now** (requires the `X-API-Key` admin header). The target URL is
        SSRF-screened (must be a public `https://` URL — loopback, private,
        link-local, and cloud-metadata addresses are rejected).
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - email
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://example.com/webhooks/mycal"
                email:
                  type: string
                  format: email
                events:
                  type: array
                  description: >
                    Defaults to holiday.created, holiday.updated, and
                    holiday.status_changed if omitted.
                  items:
                    type: string
                    enum:
                      - holiday.created
                      - holiday.updated
                      - holiday.status_changed
                      - holiday.cancelled
                      - holiday.replacement_created
                      - school.term_changed
                      - school.holiday_changed
                      - exam.date_changed
                      - exam.results_date_announced
      responses:
        "201":
          description: Subscription created. The signing secret is only ever returned here.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "wh_m1a2b3c4_d5e6f7g8"
                      url:
                        type: string
                        format: uri
                      events:
                        type: array
                        items:
                          type: string
                      secret:
                        type: string
                        description: HMAC-SHA256 signing secret for delivered payloads.
                      createdAt:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    properties:
                      note:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing or invalid admin `X-API-Key` header.

  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook subscription
      description: Deletes a webhook subscription. **Admin-gated** (requires the `X-API-Key` admin header).
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "wh_m1a2b3c4_d5e6f7g8"
      responses:
        "200":
          description: Subscription deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
                        example: true
        "401":
          description: Missing or invalid admin `X-API-Key` header.
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{id}/deliveries:
    get:
      operationId: getWebhookDeliveries
      summary: List webhook delivery attempts
      description: >
        Lists delivery attempts for a subscription. **Admin-gated** (requires
        the `X-API-Key` admin header). Delivery logging requires D1 and is not
        yet wired up, so `deliveries` is currently always empty.
      tags:
        - Webhooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "wh_m1a2b3c4_d5e6f7g8"
      responses:
        "200":
          description: Delivery attempts (currently always empty; see description).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      webhookId:
                        type: string
                      deliveries:
                        type: array
                        items: {}
                  meta:
                    type: object
                    properties:
                      note:
                        type: string
        "401":
          description: Missing or invalid admin `X-API-Key` header.
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    YearParam:
      name: year
      in: query
      description: Calendar year. Defaults to the current year.
      required: false
      schema:
        type: integer
        example: 2026

    StateParam:
      name: state
      in: query
      description: >
        Malaysian state code (e.g. SGR, JHR, KUL). When provided, results are
        filtered to include holidays applicable to that state.
      required: false
      schema:
        type: string
        example: "SGR"

    GroupParam:
      name: group
      in: query
      description: >
        School calendar group. Group A covers Johor, Kedah, Kelantan, and
        Terengganu. Group B covers all other states.
      required: false
      schema:
        type: string
        enum:
          - A
          - B
        example: "A"

  schemas:
    HolidayType:
      type: string
      enum:
        - federal
        - state
        - islamic
        - islamic_state
        - replacement
        - adhoc
      example: "federal"

    HolidayStatus:
      type: string
      enum:
        - confirmed
        - tentative
        - announced
        - cancelled
      example: "confirmed"

    ExamType:
      type: string
      enum:
        - spm
        - stpm
        - muet
        - pt3
        - stam
        - other
      example: "spm"

    LocalizedName:
      type: object
      required:
        - ms
        - en
      properties:
        ms:
          type: string
          example: "Hari Kebangsaan"
        en:
          type: string
          example: "National Day"
        zh:
          type: string
          example: "国庆日"

    Holiday:
      type: object
      required:
        - id
        - date
        - name
        - type
        - status
        - states
        - isPublicHoliday
        - gazetteLevel
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "hari-kebangsaan-2026"
        date:
          type: string
          format: date
          example: "2026-08-31"
        endDate:
          type: string
          format: date
          example: "2026-09-01"
        name:
          $ref: "#/components/schemas/LocalizedName"
        type:
          $ref: "#/components/schemas/HolidayType"
        status:
          $ref: "#/components/schemas/HolidayStatus"
        states:
          type: array
          items:
            type: string
          example:
            - "JHR"
            - "SGR"
            - "KUL"
            - "PNG"
        isPublicHoliday:
          type: boolean
          example: true
        gazetteLevel:
          type: string
          enum:
            - P
            - "N"
          description: >
            P = Persekutuan (federal gazette), N = Negeri (state gazette).
          example: "P"
        isReplacementFor:
          type: string
          description: ID of the original holiday this replaces.
          example: "hari-raya-aidilfitri-2026"
        hijriDate:
          type: string
          description: Hijri calendar date if applicable.
          example: "1 Syawal 1448"
        gazetteRef:
          type: string
          description: Reference to the official gazette.
          example: "P.U.(B) 123/2026"
        source:
          type: string
          enum:
            - jpm
            - jakim
            - state-gov
            - community
            - admin
          example: "jpm"
        confirmedAt:
          type: string
          format: date-time
          example: "2025-12-01T00:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2025-11-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-12-01T00:00:00Z"

    State:
      type: object
      required:
        - code
        - aliases
        - name
        - type
        - weekendHistory
        - group
      properties:
        code:
          type: string
          example: "JHR"
        aliases:
          type: array
          items:
            type: string
          example:
            - "johor"
            - "johor bahru"
            - "johor darul takzim"
        name:
          type: object
          required:
            - ms
            - en
          properties:
            ms:
              type: string
              example: "Johor"
            en:
              type: string
              example: "Johor"
        type:
          type: string
          enum:
            - state
            - federal_territory
          example: "state"
        weekendHistory:
          type: array
          items:
            $ref: "#/components/schemas/WeekendConfig"
        group:
          type: string
          enum:
            - A
            - B
          example: "A"

    WeekendConfig:
      type: object
      required:
        - from
        - to
        - weekendDays
        - group
      properties:
        from:
          type: string
          format: date
          description: Start date of this weekend configuration.
          example: "2014-01-01"
        to:
          type:
            - string
            - "null"
          format: date
          description: End date of this configuration, or null if current.
          example: null
        weekendDays:
          type: array
          items:
            type: integer
          description: >
            Day-of-week numbers that are weekend days (0 = Sunday, 5 = Friday, 6 = Saturday).
          example:
            - 5
            - 6
        group:
          type: string
          enum:
            - A
            - B
          example: "A"

    SchoolTerm:
      type: object
      required:
        - id
        - year
        - term
        - group
        - segments
        - totalSchoolDays
        - startDate
        - endDate
      properties:
        id:
          type: string
          example: "2026-term-1-A"
        year:
          type: integer
          example: 2026
        term:
          type: integer
          enum:
            - 1
            - 2
          example: 1
        group:
          type: string
          enum:
            - A
            - B
          example: "A"
        segments:
          type: array
          items:
            type: object
            required:
              - startDate
              - endDate
              - schoolDays
            properties:
              startDate:
                type: string
                format: date
                example: "2026-01-04"
              endDate:
                type: string
                format: date
                example: "2026-03-13"
              schoolDays:
                type: integer
                example: 50
        totalSchoolDays:
          type: integer
          example: 100
        startDate:
          type: string
          format: date
          example: "2026-01-04"
        endDate:
          type: string
          format: date
          example: "2026-05-29"

    SchoolHoliday:
      type: object
      required:
        - id
        - year
        - group
        - type
        - name
        - startDate
        - endDate
        - days
      properties:
        id:
          type: string
          example: "2026-cuti-pertengahan-A"
        year:
          type: integer
          example: 2026
        group:
          type: string
          enum:
            - A
            - B
          example: "A"
        type:
          type: string
          enum:
            - cuti_penggal_1
            - cuti_pertengahan
            - cuti_penggal_2
            - cuti_akhir
            - cuti_perayaan_kpm
          example: "cuti_pertengahan"
        name:
          type: object
          required:
            - ms
            - en
          properties:
            ms:
              type: string
              example: "Cuti Pertengahan Penggal 1"
            en:
              type: string
              example: "Mid-Term 1 Break"
        startDate:
          type: string
          format: date
          example: "2026-03-14"
        endDate:
          type: string
          format: date
          example: "2026-03-22"
        days:
          type: integer
          example: 9
        states:
          type: array
          items:
            type: string
          description: If set, this holiday only applies to these states.
          example:
            - "JHR"
            - "KDH"
        excludeStates:
          type: array
          items:
            type: string
          description: If set, this holiday does not apply to these states.
        remarks:
          type: string
          description: Additional notes about this school holiday.

    Exam:
      type: object
      required:
        - id
        - year
        - name
        - fullName
        - type
        - startDate
        - status
        - source
      properties:
        id:
          type: string
          example: "spm-2026"
        year:
          type: integer
          example: 2026
        name:
          type: string
          example: "SPM"
        fullName:
          type: object
          required:
            - ms
            - en
          properties:
            ms:
              type: string
              example: "Sijil Pelajaran Malaysia"
            en:
              type: string
              example: "Malaysian Certificate of Education"
        type:
          $ref: "#/components/schemas/ExamType"
        startDate:
          type: string
          format: date
          example: "2026-10-19"
        endDate:
          type: string
          format: date
          example: "2026-11-27"
        status:
          type: string
          enum:
            - confirmed
            - tentative
          example: "confirmed"
        resultsDate:
          type: string
          format: date
          example: "2027-03-15"
        source:
          type: string
          enum:
            - kpm
            - mpm
          example: "mpm"

    BusinessDaysResult:
      type: object
      required:
        - totalDays
        - businessDays
        - holidays
        - weekendDays
        - holidayList
      properties:
        totalDays:
          type: integer
          description: Total calendar days in the range.
          example: 31
        businessDays:
          type: integer
          description: Number of working days.
          example: 22
        holidays:
          type: integer
          description: Number of public holidays in the range.
          example: 1
        weekendDays:
          type: integer
          description: Number of weekend days in the range.
          example: 8
        holidayList:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"

    CheckDateResult:
      type: object
      required:
        - isHoliday
        - isWeekend
        - isWorkingDay
        - isSchoolDay
        - holidays
        - school
        - state
      properties:
        isHoliday:
          type: boolean
          example: true
        isWeekend:
          type: boolean
          example: false
        isWorkingDay:
          type: boolean
          example: false
        isSchoolDay:
          type: boolean
          example: false
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
        school:
          type: object
          required:
            - group
          properties:
            group:
              type: string
              enum:
                - A
                - B
              example: "B"
            term:
              type: object
              nullable: true
              properties:
                term:
                  type: integer
                  enum:
                    - 1
                    - 2
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
            holiday:
              type: object
              nullable: true
              properties:
                name:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
        state:
          type: object
          required:
            - code
            - weekendDays
            - group
          properties:
            code:
              type: string
              example: "SGR"
            weekendDays:
              type: array
              items:
                type: integer
              example:
                - 6
                - 0
            group:
              type: string
              enum:
                - A
                - B
              example: "B"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "INVALID_STATE"
            message:
              type: string
              example: "Unknown state code 'XYZ'."
            suggestions:
              type: array
              items:
                type: string
              example:
                - "SGR"
                - "SBH"
                - "SWK"

  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "INVALID_PARAMS"
              message: "Missing required parameter 'start'."

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "NOT_FOUND"
              message: "No holiday data available for year 2020."
